# Render ADHD_NODE and ADHD_BIND_IP before applying; see docs/admin/kubernetes.md.
apiVersion: v1
kind: Namespace
metadata:
  name: adhd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adhd-data
  namespace: adhd
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhd-proxy
  namespace: adhd
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 128; }
    http {
      access_log off;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen ${ADHD_BIND_IP}:8768;
        server_name _;
        client_max_body_size 1m;
        location / {
          proxy_pass http://127.0.0.1:8767;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header Connection close;
          proxy_buffering off;
          proxy_request_buffering off;
          proxy_connect_timeout 3s;
          proxy_read_timeout 15s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adhd
  namespace: adhd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adhd
  template:
    metadata:
      labels:
        app: adhd
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: ${ADHD_NODE}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          image: docker.io/library/adhd-hub@sha256:d665a77c58d70ba112d596473bb6abeca8b880fb81ec06210ec710807ae7e864
          imagePullPolicy: Never
          env:
            - name: ERL_FLAGS
              value: '+S 2:2'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '2'
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: hub-tmp
              mountPath: /tmp
        - name: proxy
          image: docker.io/library/nginx@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591
          imagePullPolicy: Never
          command: [nginx]
          args: [-c, /etc/adhd/nginx.conf, -g, 'daemon off;']
          ports:
            - name: http
              containerPort: 8768
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/adhd
              readOnly: true
            - name: proxy-tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: adhd-config
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: adhd-data
        - name: proxy-config
          configMap:
            name: adhd-proxy
        - name: hub-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: proxy-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: adhd
  namespace: adhd
spec:
  type: NodePort
  selector:
    app: adhd
  ports:
    - name: http
      port: 8766
      targetPort: http
      nodePort: 30866
